[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-processor"
version = "0.1.0"
description = "OCR preprocessing package for agent_gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["docling>=2.88.0", "pdfplumber>=0.11", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0", "reportlab>=4.0"]

[tool.setuptools]
packages = [
    "ocr_processor",
    "ocr_processor.impl",
    "ocr_processor.impl.doc",
    "ocr_processor.impl.pdf",
]

[tool.setuptools.package-dir]
ocr_processor = "."
"ocr_processor.impl" = "impl"
"ocr_processor.impl.doc" = "impl/doc"
"ocr_processor.impl.pdf" = "impl/pdf"
