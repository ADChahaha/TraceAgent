[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service for OCR preprocessing and document extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["file_extraction_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
