[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service for OCR preprocessing and document extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.88.0",
    "fastapi>=0.115,<1",
    "langgraph>=0.2,<1",
    "langchain-openai>=0.3,<1",
    "openai>=2.28,<3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "torch>=2.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[tool.setuptools]
py-modules = ["main"]
packages = [
    "file_extraction_agent",
    "file_extraction_agent.impl",
    "document_processor",
    "document_processor.impl",
    "document_processor.impl.docx",
    "document_processor.impl.pdf",
    "routes",
]

[tool.setuptools.package-data]
file_extraction_agent = ["task_specs/*.json", "model_client_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
