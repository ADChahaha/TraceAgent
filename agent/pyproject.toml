[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service for OCR preprocessing and document extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.88.0",
    "fastapi>=0.115,<1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30,<1",
]

[tool.setuptools]
py-modules = ["main"]
packages = [
    "file_extraction_agent",
    "ocr_processor",
    "ocr_processor.impl",
    "ocr_processor.impl.doc",
    "ocr_processor.impl.pdf",
    "routes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
