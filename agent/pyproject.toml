[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agent service for OCR preprocessing and document extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=0.2,<1",
    "langchain-openai>=0.3,<1",
    "mineru[core]==3.1.6",
    "onnxruntime>=1.24,<2",
    "openai>=2.28,<3",
    "python-multipart>=0.0.9",
    "torch>=2.0",
    "transformers>=4.57,<5",
    "huggingface-hub>=0.36,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[tool.setuptools]
py-modules = ["main"]
packages = [
    "service",
    "service.document_processor",
    "service.file_extraction_agent",
    "service.file_extraction_agent.impl",
    "service.route_policy_agent",
    "service.route_policy_agent.impl",
    "routes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
