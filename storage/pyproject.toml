[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceagent-storage"
version = "0.1.0"
description = "本地 S3 兼容对象存储服务。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["storage", "storage.core"]

[tool.setuptools.package-dir]
storage = "."
"storage.core" = "core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]