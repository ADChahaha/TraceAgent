syntax = "proto3";
package traceagent.v1;

// 文件准备和单轮问答共享同一服务进程及本机资源目录。
service AgentService {
  rpc PrepareResources(PrepareResourcesRequest) returns (PrepareResourcesResponse);
  rpc ChatCompletion(ChatCompletionRequest) returns (stream CompletionEvent);
  rpc CancelCompletion(CompletionRequest) returns (CompletionResponse);
}
message UploadedFile {
  string filename = 1;
  bytes content = 2;
}
message PrepareResourcesRequest { repeated UploadedFile files = 1; }
message Document {
  string filename = 1;
  string html = 2;
}
// 资源定位：type 表示组成部分（raw=原始文件 / documents=文件树 / index=embedding 索引），
// location 是 s3://<bucket>[/<key>] 形式的定位串。
message ResourceRef {
  string type = 1;
  string location = 2;
}
message PrepareResourcesResponse {
  repeated ResourceRef resource_path = 1;
  repeated Document documents = 2;
}
message QaMessage {
  string role = 1;
  string content = 2;
  // 完整历史工具调用数组，保留现有消息转换器支持的 JSON 结构。
  optional string tool_calls_json = 3;
  optional string tool_call_id = 4;
  optional string name = 5;
}
message RunOptions {
  reserved 1;
  reserved "max_tool_calls";
  optional double tool_execution_timeout = 2;
}
message ModelConfig {
  optional string provider = 1;
  optional string base_url = 2;
  optional string api_key = 3;
  optional string model_name = 4;
  optional string api_transport = 5;
  optional double temperature = 6;
  optional double top_p = 7;
  optional int32 top_k = 8;
  optional string reasoning_effort = 9;
  optional int32 max_retries = 10;
  optional double request_timeout = 11;
}
message ChatCompletionRequest {
  string completion_id = 1;
  repeated ResourceRef resource_path = 2;
  repeated QaMessage messages = 3;
  RunOptions run_options = 4;
  ModelConfig model_config = 5;
  // 保留原有模型覆盖字段；嵌套 model_config 存在时优先使用。
  optional string base_url = 6;
  optional string api_key = 7;
  optional string openai_api_key = 8;
  optional string model = 9;
  optional string api_transport = 10;
  optional double temperature = 11;
  optional double top_p = 12;
  optional int32 top_k = 13;
  // 兼容原请求字段；该 RPC 始终流式返回。
  optional bool stream = 14;
  reserved "documents", "metadata", "memory", "task_spec";
}
message ToolCall {
  string id = 1;
  string name = 2;
  string args_json = 3;
}
message CompletionEvent {
  string type = 1;
  uint64 seq = 2;
  optional string status = 3;
  optional string content = 4;
  optional string tool = 5;
  optional string tool_call_id = 6;
  optional string args_json = 7;
  optional string result_json = 8;
  repeated ToolCall tool_calls = 9;
  optional uint32 tool_call_count = 10;
  optional bool is_final = 11;
  optional string stop_signal = 12;
  optional string error = 13;
  optional string error_message = 14;
  // 每次实际模型请求使用独立 ID；重试事件关联失败的请求。
  optional string message_id = 15;
  optional string delta = 16;
  optional uint32 attempt = 17;
  optional uint32 max_attempts = 18;
  optional uint32 retry_delay_ms = 19;
}
message CompletionRequest { string completion_id = 1; }
message CompletionResponse {
  string id = 1;
  string status = 2;
}
