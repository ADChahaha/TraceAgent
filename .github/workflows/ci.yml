name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  agent-ocr-install:
    name: Agent OCR dependencies install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent with OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "agent[dev]"

      - name: Verify OCR dependency imports
        env:
          PYTHONPATH: agent
        run: |
          python - <<'PY'
          import importlib.metadata
          import shutil
          import fastapi
          import langchain_openai
          import langgraph
          import onnxruntime
          import openai
          import torch
          import transformers
          from service.document_processor.pdf.converter import resolve_mineru_lang

          importlib.metadata.version("mineru")
          assert resolve_mineru_lang() == "japan"
          assert shutil.which("mineru"), "mineru CLI is not on PATH"
          print("agent OCR dependency imports passed")
          PY

      - name: Verify MinerU CLI starts
        run: mineru --help

      - name: Run agent tests that do not call real OCR or LLM
        env:
          PYTHONPATH: agent
        run: |
          pytest \
            agent/tests/document_processor \
            agent/tests/file_extraction_agent \
            agent/tests/routes \
            agent/tests/test_pyproject_dependencies.py \
            -q

  backend:
    name: Backend tests without real agent calls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Run backend tests
        env:
          PYTHONPATH: .
          BACKEND_DATABASE_PATH: ":memory:"
        run: pytest backend/tests -q

  frontend:
    name: Frontend tests without backend service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --dir frontend test --runInBand

  deployment-smoke:
    name: Production startup smoke test
    runs-on: ubuntu-latest
    needs: [agent-ocr-install, backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install production dependencies and build
        run: ./scripts/install.sh

      - name: Write CI runtime env
        run: |
          cat > .env <<'ENV'
          BASE_URL=http://127.0.0.1:9/v1
          OPENAI_API_KEY=ci-placeholder
          MODEL=ci-placeholder-model
          MODEL_API_TRANSPORT=responses
          BACKEND_DATABASE_PATH=:memory:
          AGENT_HOST=127.0.0.1
          AGENT_PORT=8001
          BACKEND_HOST=127.0.0.1
          BACKEND_PORT=8000
          FRONTEND_HOST=127.0.0.1
          FRONTEND_PORT=3000
          ENV

      - name: Start production services
        run: |
          set -Eeuo pipefail
          ./scripts/start.sh > /tmp/traceagent-start.log 2>&1 &
          start_pid=$!

          cleanup() {
            kill "$start_pid" >/dev/null 2>&1 || true
            wait "$start_pid" >/dev/null 2>&1 || true
            cat /tmp/traceagent-start.log
          }
          trap cleanup EXIT

          wait_for_url() {
            local url="$1"
            for _ in {1..90}; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $url"
            return 1
          }

          wait_for_url http://127.0.0.1:8001/healthz
          wait_for_url http://127.0.0.1:8000/healthz
          wait_for_url http://127.0.0.1:3000/
