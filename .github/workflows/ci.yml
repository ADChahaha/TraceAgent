name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  agent-ocr-install:
    name: Agent OCR dependencies install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent with OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "agent[dev]"

      - name: Verify OCR dependency imports
        env:
          PYTHONPATH: agent
        run: |
          python - <<'PY'
          import importlib.metadata
          import shutil
          import fastapi
          import langchain_openai
          import langgraph
          import onnxruntime
          import openai
          import torch
          import transformers
          from service.document_processor.mineru_converter import resolve_mineru_lang

          importlib.metadata.version("mineru")
          assert resolve_mineru_lang() == "japan"
          assert shutil.which("mineru"), "mineru CLI is not on PATH"
          print("agent OCR dependency imports passed")
          PY

      - name: Verify MinerU CLI starts
        run: mineru --help

      - name: Run agent tests that do not call real OCR or LLM
        env:
          PYTHONPATH: agent
        run: |
          pytest \
            agent/tests/document_processor \
            agent/tests/file_extraction_agent \
            agent/tests/route_policy_agent \
            agent/tests/routes \
            -q

  backend:
    name: Backend tests without real agent calls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Run backend tests
        env:
          PYTHONPATH: .
          BACKEND_DATABASE_PATH: ":memory:"
        run: pytest backend/tests -q

  frontend:
    name: Frontend tests without backend service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --dir frontend test --runInBand
